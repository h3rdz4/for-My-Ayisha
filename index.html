            max-width: 280px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: inset 0 2px 5px rgba(255,107,107,0.05);

        .track-info {

            font-size: 0.8rem;
            color: #666;
        }

        .track-title {
            font-weight: bold;
            color: var(--primary-color);
        }

        .play-pause-btn {

            color: white;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            box-shadow: 0 3px 8px rgba(255,107,107,0.3);
            transition: all 0.2s ease;
        }

        .play-pause-btn:hover {

            transform: scale(1.05);
        }

        .reason-box {

            align-items: center;
            justify-content: center;
